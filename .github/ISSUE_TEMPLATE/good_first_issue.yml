name: Good first issue
description: A well-scoped, newcomer-friendly task
title: "good first issue: "
labels: ["good first issue", "help wanted"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the code path and why the change is useful.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a checklist of observable outcomes.
      value: |
        - [ ] 
        - [ ] Tests cover the change
        - [ ] Docs updated if config/behavior changed
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
      placeholder: src/decoder/sep41.ts, test/decoder.test.ts
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
  - type: input
    id: size
    attributes:
      label: Size estimate
      placeholder: 2-4 hours
